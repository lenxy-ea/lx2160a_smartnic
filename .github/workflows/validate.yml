name: Validate source
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      full_build:
        description: Build firmware, kernel, runtime and Debian SATA image
        type: boolean
        default: false
      build_runner:
        description: Isolated Linux x64 runner label with at least 80 GiB free disk
        type: string
        default: x200-builder
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false
      - run: sudo apt-get update && sudo apt-get install -y gcc make libssl-dev python3 patch binutils kmod
      - run: python3 tools/check_source.py --history
      - run: make -C bsp/lx2160-x200 check test
  build:
    if: github.event_name == 'workflow_dispatch' && inputs.full_build
    needs: source
    runs-on: ${{ inputs.build_runner }}
    timeout-minutes: 360
    steps:
      - name: Check full-build disk capacity
        run: test "$(df --output=avail -B1 "$RUNNER_TEMP" | tail -1)" -ge 85899345920
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install host build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y podman make python3 kmod patch binutils
          sudo modprobe binfmt_misc
          mountpoint -q /proc/sys/fs/binfmt_misc || sudo mount -t binfmt_misc binfmt_misc /proc/sys/fs/binfmt_misc
          sudo chown -R root:root "$GITHUB_WORKSPACE"
      - run: sudo make -C bsp/lx2160-x200 toolchain
      - run: sudo make -C bsp/lx2160-x200 firmware JOBS=2
      - run: sudo make -C bsp/lx2160-x200 kernel JOBS=2
      - name: Package sample runtime configuration
        run: sudo make -C bsp/lx2160-x200 manual-rate runtime CONFIG="$GITHUB_WORKSPACE/bsp/lx2160-x200/pcie-management/config.example.json"
      - run: sudo make -C bsp/lx2160-x200 bootstrap rootfs sata
      - name: Confirm source checkout is unchanged
        run: sudo git diff --exit-code
